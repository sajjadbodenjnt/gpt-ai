name: AIBondhu Scratch CPU 5h
run-name: AIBondhu random-init CPU training (5 hours)
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/train-scratch-5h.yml"
      - "scripts/train_scratch_5h.py"
      - "aibondhu/scratch_gpt.py"
      - "requirements-scratch.txt"
  workflow_dispatch:
    inputs:
      max_articles:
        description: Maximum eligible PMC Open Access articles
        required: true
        default: "300"
      training_minutes:
        description: CPU training time in minutes (maximum 300)
        required: true
        default: "300"
jobs:
  train-from-scratch:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      TOKENIZERS_PARALLELISM: "false"
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install CPU PyTorch and scratch-training dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu 'torch>=2.2'
          pip install -r requirements-scratch.txt
      - name: Verify CPU-only environment and compile
        run: |
          python -c "import torch; print('PyTorch:', torch.__version__); print('CUDA available:', torch.cuda.is_available()); print('CPU threads:', torch.get_num_threads()); assert not torch.cuda.is_available()"
          python -m py_compile aibondhu/scratch_gpt.py scripts/train_scratch_5h.py
      - name: Download licensed biomedical text and attribution manifest
        run: |
          python scripts/download_pmc_dataset.py \
            --max-articles "${{ inputs.max_articles || '300' }}" \
            --output data/processed.jsonl \
            --manifest data/pmc_manifest.jsonl
      - name: Train AIBondhu from random initialization for up to five hours
        run: |
          python scripts/train_scratch_5h.py \
            --input data/processed.jsonl \
            --output outputs/aibondhu-scratch \
            --minutes "${{ inputs.training_minutes || '300' }}"
      - name: Upload model checkpoints, tokenizer and source manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aibondhu-scratch-cpu-5h
          path: |
            outputs/aibondhu-scratch/
            data/pmc_manifest.jsonl
          if-no-files-found: warn
          retention-days: 30
