name: Train AIBondhu (GPU)
on:
  workflow_dispatch:
    inputs:
      dataset_path:
        description: Path to authorized JSONL dataset available on the runner/repository
        required: true
        default: data/training.jsonl
      config:
        description: Training config path
        required: true
        default: configs/train.yaml
jobs:
  train:
    # Requires your own trusted GPU runner with these labels and CUDA-enabled PyTorch.
    runs-on: [self-hosted, linux, x64, gpu]
    timeout-minutes: 1440
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Validate dataset path
        run: test -f "${{ inputs.dataset_path }}" || (echo "Dataset not found. Place an authorized JSONL dataset on the runner." && exit 1)
      - name: Prepare dataset
        run: python scripts/prepare_dataset.py --input "${{ inputs.dataset_path }}" --output data/processed.jsonl
      - name: Train from random initialization
        run: python -m aibondhu.train --config "${{ inputs.config }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aibondhu-training-output
          path: outputs/
          if-no-files-found: warn
          retention-days: 14
