name: Train AIBondhu on licensed PMC medical literature
on:
  workflow_dispatch:
    inputs:
      max_articles:
        description: Maximum eligible open-access articles to stream (not the whole 3.4M corpus)
        required: true
        default: "10000"
      max_steps:
        description: Optimizer steps
        required: true
        default: "20000"
jobs:
  train:
    # A trusted self-hosted CUDA GPU runner is required; GitHub-hosted runners do not guarantee GPUs.
    runs-on: [self-hosted, linux, x64, gpu]
    timeout-minutes: 1440
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Stream and filter real medical literature
        run: >-
          python scripts/download_pmc_dataset.py
          --max-articles "${{ inputs.max_articles }}"
          --output data/processed.jsonl
          --manifest data/pmc_manifest.jsonl
      - name: Verify CUDA
        run: python -c "import torch; print(torch.cuda.get_device_name(0)); assert torch.cuda.is_available()"
      - name: Train AIBondhu from random initialization
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("configs/train.yaml")
          s = p.read_text()
          import os
          s = s.replace("max_steps: 20000", "max_steps: " + os.environ["MAX_STEPS"])
          p.write_text(s)
          PY
          python -m aibondhu.train --config configs/train.yaml
        env:
          MAX_STEPS: "${{ inputs.max_steps }}"
      - name: Evaluate checkpoint
        run: python -m aibondhu.evaluate --checkpoint outputs/aibondhu/best.pt --config configs/train.yaml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aibondhu-pmc-training-output
          path: |
            outputs/
            data/pmc_manifest.jsonl
          if-no-files-found: warn
          retention-days: 14
