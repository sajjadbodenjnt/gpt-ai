name: Train AIBondhu (GPU)
on:
  workflow_dispatch:
    inputs:
      config:
        description: Training config path
        required: true
        default: configs/train.yaml
jobs:
  train:
    # Configure your own trusted GPU runner with these labels and PyTorch/CUDA support.
    runs-on: [self-hosted, linux, x64, gpu]
    timeout-minutes: 1440
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python scripts/prepare_dataset.py --input data/sample.jsonl --output data/processed.jsonl --min-chars 10
      - name: Train from random initialization
        run: python -m aibondhu.train --config "${{ inputs.config }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aibondhu-training-output
          path: outputs/
          if-no-files-found: warn
          retention-days: 14
