name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  test-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest -q
      - run: python scripts/prepare_dataset.py --input data/sample.jsonl --output data/processed.jsonl --min-chars 10
      - run: python -m aibondhu.train --config configs/smoke.yaml
