[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aibondhu-medical-ai"
version = "0.1.0"
description = "From-scratch experimental medical-domain Transformer"
requires-python = ">=3.10"
dependencies = ["torch>=2.2", "PyYAML>=6.0", "tqdm>=4.66"]

[tool.setuptools.packages.find]
where = ["."]
include = ["aibondhu*"]
